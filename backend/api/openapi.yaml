openapi: 3.1.0
info:
  title: Kingsway Backend API
  version: 0.2.0
  description: Kingsway Operation Center backend HTTP contract. Authenticated JSON POST write endpoints accept optional Idempotency-Key for safe same-payload retry.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: health
  - name: auth
  - name: academic
  - name: finance
  - name: files
  - name: notifications
  - name: dashboards
  - name: admin
paths:
  /healthz:
    get:
      tags: [health]
      security: []
      responses:
        "200":
          description: API liveness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [health]
      security: []
      responses:
        "200":
          description: API readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /metrics:
    get:
      tags: [health]
      security: []
      responses:
        "200":
          description: In-process request metrics snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metrics"
  /v1/auth/bootstrap-owner:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapOwnerInput"
      responses:
        "201":
          $ref: "#/components/responses/LoginResult"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          $ref: "#/components/responses/LoginResult"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      tags: [auth]
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Error"
  /v1/session:
    get:
      tags: [auth]
      responses:
        "200":
          description: Current user, principal, capabilities, and dashboard route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /v1/branches:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/BranchList"
    post:
      tags: [academic]
      requestBody:
        $ref: "#/components/requestBodies/CreateBranch"
      responses:
        "201":
          $ref: "#/components/responses/Branch"
  /v1/branches/{branch_id}:
    patch:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchPathID"
      requestBody:
        $ref: "#/components/requestBodies/CreateBranch"
      responses:
        "200":
          $ref: "#/components/responses/Branch"
    delete:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchPathID"
      responses:
        "200":
          $ref: "#/components/responses/Branch"
  /v1/branches/{branch_id}/staff:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchPathID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/StaffList"
    post:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchPathID"
      requestBody:
        $ref: "#/components/requestBodies/CreateStaff"
      responses:
        "201":
          $ref: "#/components/responses/Staff"
  /v1/staff/{staff_id}:
    patch:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/StaffID"
      requestBody:
        $ref: "#/components/requestBodies/UpdateStaff"
      responses:
        "200":
          $ref: "#/components/responses/Staff"
    delete:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/StaffID"
      responses:
        "200":
          $ref: "#/components/responses/Staff"
  /v1/student-assignment-hub:
    get:
      tags: [academic]
      description: Combined Student & Assignment Hub list for branch, status, teacher, FIN, and name search.
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: status
          in: query
          schema:
            enum: [active, left, graduated]
        - name: teacher_id
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/StudentAssignmentHubPage"
  /v1/students:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: status
          in: query
          schema:
            enum: [active, left, graduated]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/StudentList"
    post:
      tags: [academic]
      requestBody:
        $ref: "#/components/requestBodies/CreateStudent"
      responses:
        "201":
          $ref: "#/components/responses/Student"
  /v1/students/by-fin/{fin}:
    get:
      tags: [academic]
      parameters:
        - name: fin
          in: path
          required: true
          schema:
            type: string
            minLength: 7
            maxLength: 7
      responses:
        "200":
          $ref: "#/components/responses/Student"
  /v1/students/{student_id}:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/StudentID"
      responses:
        "200":
          $ref: "#/components/responses/Student"
    patch:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/StudentID"
      requestBody:
        $ref: "#/components/requestBodies/UpdateStudent"
      responses:
        "200":
          $ref: "#/components/responses/Student"
  /v1/students/{student_id}/account:
    post:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/StudentID"
      requestBody:
        $ref: "#/components/requestBodies/CreateStudentAccount"
      responses:
        "201":
          description: Linked student and created login user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  student:
                    $ref: "#/components/schemas/Student"
                  user:
                    $ref: "#/components/schemas/User"
  /v1/teachers:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: status
          in: query
          schema:
            enum: [pending_owner_approval, active, terminated]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/TeacherList"
    post:
      tags: [academic]
      requestBody:
        $ref: "#/components/requestBodies/RegisterTeacher"
      responses:
        "201":
          description: Teacher and user.
  /v1/teachers/{teacher_id}:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/TeacherID"
      responses:
        "200":
          $ref: "#/components/responses/Teacher"
    patch:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/TeacherID"
      requestBody:
        $ref: "#/components/requestBodies/UpdateTeacher"
      responses:
        "200":
          $ref: "#/components/responses/Teacher"
    delete:
      tags: [finance]
      description: Hard-deletes the teacher, linked login user, and teacher-owned records when no active students are assigned.
      parameters:
        - $ref: "#/components/parameters/TeacherID"
      responses:
        "200":
          $ref: "#/components/responses/Teacher"
        "409":
          description: Teacher has assigned students and cannot be deleted.
  /v1/teacher-finance:
    get:
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: subject
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            enum: [pending_owner_approval, active, terminated]
        - name: salary_model
          in: query
          schema:
            enum: [fixed, percent, hybrid]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/TeacherFinanceRecordList"
  /v1/teachers/{teacher_id}/activate:
    post:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/TeacherID"
      responses:
        "200":
          $ref: "#/components/responses/Teacher"
  /v1/courses:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/CourseList"
    post:
      tags: [academic]
      requestBody:
        $ref: "#/components/requestBodies/CreateCourse"
      responses:
        "201":
          description: Course and score categories.
  /v1/courses/{course_id}:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/CourseID"
      responses:
        "200":
          $ref: "#/components/responses/Course"
  /v1/classes:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/ClassList"
    post:
      tags: [academic]
      requestBody:
        $ref: "#/components/requestBodies/CreateClass"
      responses:
        "201":
          $ref: "#/components/responses/Class"
  /v1/classes/{class_id}:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/ClassID"
      responses:
        "200":
          $ref: "#/components/responses/Class"
  /v1/classes/{class_id}/students:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/ClassID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Class enrollments.
    post:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/ClassID"
      requestBody:
        $ref: "#/components/requestBodies/EnrollStudent"
      responses:
        "201":
          description: Created enrollment.
  /v1/classes/{class_id}/assignments:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/ClassID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/AssignmentList"
    post:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/ClassID"
      requestBody:
        $ref: "#/components/requestBodies/CreateAssignment"
      responses:
        "201":
          $ref: "#/components/responses/Assignment"
  /v1/assignments:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: class_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/AssignmentList"
    post:
      tags: [academic]
      requestBody:
        $ref: "#/components/requestBodies/CreateAssignment"
      responses:
        "201":
          $ref: "#/components/responses/Assignment"
  /v1/rooms:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Rooms.
    post:
      tags: [academic]
      requestBody:
        $ref: "#/components/requestBodies/CreateRoom"
      responses:
        "201":
          description: Created room.
  /v1/rooms/{room_id}:
    patch:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        $ref: "#/components/requestBodies/UpdateRoom"
      responses:
        "200":
          description: Updated room.
    delete:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: Deactivated room.
  /v1/schedules:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: item_type
          in: query
          schema:
            enum: [lesson, exam, event]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Schedule items.
    post:
      tags: [academic]
      requestBody:
        $ref: "#/components/requestBodies/CreateScheduleItem"
      responses:
        "201":
          description: Created schedule item.
        "409":
          $ref: "#/components/responses/Error"
  /v1/exams:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: class_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Exams.
    post:
      tags: [academic]
      requestBody:
        $ref: "#/components/requestBodies/CreateExam"
      responses:
        "201":
          description: Exam and participants.
  /v1/exams/{exam_id}:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/ExamID"
      responses:
        "200":
          description: Exam.
  /v1/exams/{exam_id}/results:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/ExamID"
        - $ref: "#/components/parameters/BranchID"
        - name: student_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Exam results.
    post:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/ExamID"
      requestBody:
        $ref: "#/components/requestBodies/CreateExamResult"
      responses:
        "201":
          description: Created exam result.
  /v1/exam-results:
    get:
      tags: [academic]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: exam_id
          in: query
          schema:
            type: string
        - name: student_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Exam results.
  /v1/dashboard/academic:
    get:
      tags: [dashboards]
      parameters:
        - $ref: "#/components/parameters/BranchID"
      responses:
        "200":
          description: Academic dashboard counts.
  /v1/dashboard/owner:
    get:
      tags: [dashboards]
      parameters:
        - $ref: "#/components/parameters/BranchID"
      responses:
        "200":
          description: Owner dashboard.
  /v1/dashboard/receptionist:
    get:
      tags: [dashboards]
      responses:
        "200":
          description: Receptionist dashboard.
  /v1/dashboard/teacher:
    get:
      tags: [dashboards]
      responses:
        "200":
          description: Teacher dashboard.
  /v1/dashboard/student:
    get:
      tags: [dashboards]
      responses:
        "200":
          description: Student dashboard.
  /v1/payments:
    get:
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: status
          in: query
          schema:
            enum: [pending, paid, overdue, cancelled]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/PaymentList"
    post:
      tags: [finance]
      requestBody:
        $ref: "#/components/requestBodies/CreatePayment"
      responses:
        "201":
          $ref: "#/components/responses/Payment"
  /v1/payments/{payment_id}:
    get:
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/PaymentID"
      responses:
        "200":
          $ref: "#/components/responses/Payment"
  /v1/salary-models:
    get:
      tags: [finance]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Salary models.
    post:
      tags: [finance]
      requestBody:
        $ref: "#/components/requestBodies/CreateSalaryModel"
      responses:
        "201":
          description: Created salary model.
  /v1/salary/swap-allocation:
    post:
      tags: [finance]
      requestBody:
        $ref: "#/components/requestBodies/SwapAllocation"
      responses:
        "200":
          description: Swap allocation result.
  /v1/files:
    get:
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/BranchID"
        - name: owner_type
          in: query
          schema:
            type: string
        - name: owner_id
          in: query
          schema:
            type: string
        - name: purpose
          in: query
          schema:
            enum: [material, payment_receipt, event, passport, diploma, profile_photo, exam_writing]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/FileList"
    post:
      tags: [files]
      requestBody:
        $ref: "#/components/requestBodies/RegisterFile"
      responses:
        "201":
          $ref: "#/components/responses/File"
  /v1/files/upload:
    post:
      tags: [files]
      description: Uploads a file up to 10 MB. Use `standard` for normal files and `special` for very important files. Lossy optimization is not reversible. Special PDFs may have non-content metadata removed, but content must not be altered; Special JPG/PNG/WebP images should not be recompressed or quality-ratio converted. `standard` + `profile_photo` image uploads are optimized display assets at 768x768 JPEG quality 85 with metadata stripped.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [branch_id, owner_type, owner_id, category, purpose, file]
              properties:
                branch_id:
                  type: string
                owner_type:
                  type: string
                owner_id:
                  type: string
                category:
                  enum: [standard, special]
                purpose:
                  enum: [material, payment_receipt, event, passport, diploma, profile_photo, exam_writing]
                file:
                  type: string
                  format: binary
      responses:
        "201":
          $ref: "#/components/responses/File"
  /v1/files/{file_id}:
    get:
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          $ref: "#/components/responses/File"
    delete:
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          $ref: "#/components/responses/File"
  /v1/files/{file_id}/download-url:
    get:
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Short-lived MinIO presigned download URL.
  /v1/files/retention/cleanup:
    post:
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Owner-triggered retention cleanup.
  /v1/notifications:
    get:
      tags: [notifications]
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/NotificationList"
  /v1/notifications/{notification_id}/read:
    post:
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/NotificationID"
      responses:
        "200":
          $ref: "#/components/responses/Notification"
  /v1/admin/outbox:
    get:
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema:
            enum: [pending, publishing, published, failed]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Owner-only outbox event page.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
            X-Limit:
              $ref: "#/components/headers/XLimit"
            X-Offset:
              $ref: "#/components/headers/XOffset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboxEvent"
  /v1/admin/outbox/{event_id}/retry:
    post:
      tags: [admin]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Failed event reset to pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxEvent"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BranchID:
      name: branch_id
      in: query
      schema:
        type: string
    BranchPathID:
      name: branch_id
      in: path
      required: true
      schema:
        type: string
    RoomID:
      name: room_id
      in: path
      required: true
      schema:
        type: string
    StaffID:
      name: staff_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    StudentID:
      name: student_id
      in: path
      required: true
      schema:
        type: string
    TeacherID:
      name: teacher_id
      in: path
      required: true
      schema:
        type: string
    CourseID:
      name: course_id
      in: path
      required: true
      schema:
        type: string
    ClassID:
      name: class_id
      in: path
      required: true
      schema:
        type: string
    ExamID:
      name: exam_id
      in: path
      required: true
      schema:
        type: string
    PaymentID:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
    FileID:
      name: file_id
      in: path
      required: true
      schema:
        type: string
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
  headers:
    XTotalCount:
      schema:
        type: integer
    XLimit:
      schema:
