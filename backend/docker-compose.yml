services:
  postgres:
    image: postgres:18-alpine
    container_name: kingsway-postgres
    environment:
      POSTGRES_DB: kingsway
      POSTGRES_USER: kingsway
      POSTGRES_PASSWORD: kingsway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingsway -d kingsway"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: kingsway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: kingsway-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: kingsway
      RABBITMQ_DEFAULT_PASS: kingsway
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: kingsway-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kingsway
      MINIO_ROOT_PASSWORD: kingsway-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
