services:
  postgres:
    image: postgres:18-alpine
    container_name: kingsway-postgres
    environment:
      POSTGRES_DB: kingsway
      POSTGRES_USER: kingsway
      POSTGRES_PASSWORD: kingsway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingsway -d kingsway"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: kingsway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: kingsway-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: kingsway
      RABBITMQ_DEFAULT_PASS: kingsway
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: kingsway-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kingsway
      MINIO_ROOT_PASSWORD: kingsway-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: kingsway-api
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      JWT_SECRET: change-me
      DATA_STORE: postgres
      RUN_MIGRATIONS: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "600"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: kingsway
      POSTGRES_USER: kingsway
      POSTGRES_PASSWORD: kingsway
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://kingsway:kingsway@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: kingsway
      MINIO_SECRET_KEY: kingsway-secret
      MINIO_BUCKET_STANDARD: kingsway-standard
      MINIO_BUCKET_SPECIAL: kingsway-special
      MINIO_USE_SSL: "false"
      RETENTION_WORKER_ENABLED: "true"
      RETENTION_WORKER_INTERVAL_SECONDS: "3600"
      RETENTION_WORKER_LIMIT: "100"
      OUTBOX_DISPATCHER_ENABLED: "true"
      OUTBOX_DISPATCHER_INTERVAL_SECONDS: "5"
      OUTBOX_DISPATCHER_BATCH: "50"
      OUTBOX_MAX_ATTEMPTS: "10"
      NOTIFICATION_WORKERS_ENABLED: "true"
      PAYMENT_REMINDER_INTERVAL_SECONDS: "21600"
      PAYMENT_REMINDER_HORIZON_DAYS: "7"
      FILE_RETENTION_NOTICE_INTERVAL_SECONDS: "21600"
      FILE_RETENTION_NOTICE_HORIZON_DAYS: "7"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    container_name: kingsway-frontend
    environment:
      NODE_ENV: production
      KINGSWAY_API_BASE_URL: http://api:8080
      KINGSWAY_AUTH_COOKIE_SECURE: "false"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/en/login >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  minio-data:
